[platformio]
default_envs = d1mini

[env:d1mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
platform_packages =
  framework-arduinoespressif8266 @ 3.1.2
monitor_speed = 115200
build_type = debug

; This is a Wi-Fi/Web UI skeleton only. CAN generation is intentionally absent.
