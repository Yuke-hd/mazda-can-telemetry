[platformio]
default_envs = d1mini

[env:d1mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif8266 @ 3.30102.0
monitor_speed = 115200
build_type = debug
build_src_filter = +<main.cpp> -<mcp2515_bench.cpp>

; This is a Wi-Fi/Web UI skeleton only. CAN generation is intentionally absent.

; PROMINENT ISOLATED-BENCH TARGET: never select this environment for a vehicle
; or a release build. The shared-VCC MCP2515/TJA1050 module must be powered at
; 3.3 V while its SPI and INT signals are connected to the D1 Mini.
[env:bench_mcp2515]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif8266 @ 3.30102.0
monitor_speed = 115200
build_type = debug
build_flags = -DMCAN_BENCH_ONLY=1
build_src_filter = +<mcp2515_bench.cpp> -<main.cpp>
