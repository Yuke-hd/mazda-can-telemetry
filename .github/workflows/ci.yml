name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-14 cmake ninja-build ripgrep python3
      - name: Check host toolchain versions
        run: python3 tools/check_toolchain.py --scope host
      - name: Validate WeAct vehicle and T-CAN485 bench separation
        run: python3 tools/validate_weact_vehicle_artifacts.py
      - name: Test toolchain checker diagnostics
        run: python3 -m unittest discover -s tests/tools -p '*_test.py'
      - name: Validate C++ formatting
        shell: bash
        run: |
          mapfile -t sources < <(find lib components firmware tests -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print)
          test "${#sources[@]}" -gt 0
          clang-format-14 --dry-run --Werror "${sources[@]}"
      - name: Configure host tests
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build host tests
        run: cmake --build build/host --parallel
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure
  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check and build with ESP-IDF v5.5.4
        run: |
          docker run --rm -v "$PWD:/project" -w /project espressif/idf:v5.5.4 \
            bash -lc 'source /opt/esp/idf/export.sh >/dev/null && python3 tools/check_toolchain.py --scope firmware && python3 tools/validate_weact_vehicle_artifacts.py && cd firmware/weact-can485-v1.1 && idf.py set-target esp32 && idf.py build && cd ../tcan485-bench-ack-only && idf.py set-target esp32 && idf.py build'
