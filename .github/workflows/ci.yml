name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format cmake ninja-build
      - name: Validate C++ formatting
        shell: bash
        run: |
          mapfile -t sources < <(find lib tests -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print)
          test "${#sources[@]}" -gt 0
          clang-format --dry-run --Werror "${sources[@]}"
      - name: Configure host tests
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build host tests
        run: cmake --build build/host --parallel
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure
